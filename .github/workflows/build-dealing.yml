name: Build TradeFX dealing -> /dealing

# Compila la SPA de app/ y actualiza /dealing en este mismo repo (tradefx.cl).
# Sin tokens externos: commit con el GITHUB_TOKEN integrado.
#   - Automático al cambiar app/** (push a main)
#   - Manual: Actions -> "Build TradeFX dealing -> /dealing" -> Run workflow
# No entra en bucle: solo se dispara por cambios en app/**, y el commit toca /dealing.

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dealing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build SPA
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Copiar build a /dealing
        run: |
          rm -rf dealing
          mkdir -p dealing
          cp -r app/dist/. dealing/
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dealing
          if git diff --cached --quiet; then
            echo "Sin cambios en /dealing."
          else
            git commit -m "build: TradeFX -> /dealing"
            git push
            echo "Actualizado /dealing."
          fi
